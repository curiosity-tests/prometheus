          elif command -v dnf >/dev/null 2>&1; then $SUDO dnf install -y curl ca-certificates bash || true
          elif command -v yum >/dev/null 2>&1; then $SUDO yum install -y curl ca-certificates bash || true
          elif command -v zypper >/dev/null 2>&1; then $SUDO zypper -n install curl ca-certificates bash || true
          fi
          exit 0

      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          persist-credentials: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - uses: prometheus/promci-setup@55bd31fe92710532260eb57c554f2697363285c5 # v0.2.2
        with:
          cache_key_suffix: upgrade
      - run: go test -v --race ./cmd/prometheus/ --test.version-upgrade=true --test.lts-version=${{ matrix.lts_version }} -run TestVersionUpgrade

  list_oldest_go_version:
    name: List the oldest supported Go version
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.go.outputs.versions }}
    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - id: go
        # Upstream only supports the two latest minor releases, so the oldest
        # supported one is the lowest version listed. Emit it as a
        # single-element JSON array consumed by the matrix below.
        run: |
          versions=$(curl -sSf 'https://go.dev/dl/?mode=json' \
            | jq -c '[[.[].version | ltrimstr("go") | split(".")[1] | tonumber] | min | "1.\(.)"]')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  test_go_oldest:
    name: Go tests with previous Go version
    needs: list_oldest_go_version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go_version: ${{ fromJSON(needs.list_oldest_go_version.outputs.versions) }}
    env:
      # Enforce the Go version.
      GOTOOLCHAIN: local
    container:
      image: quay.io/prometheus/golang-builder:${{ matrix.go_version }}-base
    steps:
      - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
        shell: sh
        # Best-effort probe, never a gate. Inside a container job running as a
        # non-root user, apt-get cannot write /var/lib/apt/lists and exits 100,
        # which failed ardupilot's build job at step 3 before any of its own work
        # ran. GitHub uses `sh -e`, so a failing command aborts the script and a
