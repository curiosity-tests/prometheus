name: fuzzing
on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  fuzzing:
    name: Run Go Fuzz Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fuzz_test: [[FuzzParseMetricText, FuzzParseOpenMetric], [FuzzParseMetricSelector, FuzzParseExpr], [FuzzXORChunk, FuzzXOR2Chunk], [FuzzParseProtobuf]]
    steps:
      - name: Checkout repository
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          persist-credentials: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Run Fuzzing
        run: |
          for fuzz_test in ${{ join(matrix.fuzz_test, ' ') }}; do
            go test -fuzz="${fuzz_test}$" -fuzztime=4m ./util/fuzzing
          done
        id: fuzz
      - name: Upload Crash Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-artifacts-${{ join(matrix.fuzz_test, '-') }}
          path: util/fuzzing/testdata/fuzz/
  fuzzing_status:
    # This status check aggregates the individual matrix jobs of the fuzzing
    # step into a final status. Fails if a single matrix job fails, succeeds if
    # all matrix jobs succeed.
    name: Fuzzing
    runs-on: ubuntu-latest
    needs: [fuzzing]
    if: always()
    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Successful fuzzing
        if: ${{ !(contains(needs.*.result, 'failure')) && !(contains(needs.*.result, 'cancelled')) }}
        run: exit 0
      - name: Failing or cancelled fuzzing
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
